<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="yuan工作台">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E8F5E9">
<title>yuan工作台</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#E8F5E9;--bg2:#C8E6C9;--accent:#81C784;--accent-d:#66BB6A;--accent-l:#A5D6A7;
  --text:#2E7D32;--text2:#388E3C;--text3:#4CAF50;--white:#fff;--white90:rgba(255,255,255,.9);
  --shadow:0 2px 8px rgba(46,125,50,.12);--shadow-lg:0 4px 20px rgba(46,125,50,.18);
  --radius:14px;--radius-sm:10px;--radius-xs:6px;--transition:all .25s ease;
}
html{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);height:100%;overflow:hidden;font-size:15px;line-height:1.5}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--accent-l);border-radius:4px}
button{cursor:pointer;border:none;background:none;font-family:inherit;font-size:inherit;color:inherit}
input,textarea{font-family:inherit;font-size:inherit;color:var(--text);border:1.5px solid var(--bg2);border-radius:var(--radius-xs);padding:8px 12px;background:var(--white);outline:none;transition:var(--transition)}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(129,199,132,.25)}

/* ===== APP LAYOUT ===== */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{background:var(--white);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);z-index:10;flex-shrink:0;gap:10px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.logo span{background:linear-gradient(135deg,var(--accent),var(--text));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-center{display:flex;align-items:center;gap:12px}
.header-date{font-size:14px;color:var(--text2);font-weight:500}
.header-stats{display:flex;gap:12px;align-items:center}
.stat-ring{position:relative;width:42px;height:42px;flex-shrink:0}
.stat-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.stat-ring .ring-bg{fill:none;stroke:var(--bg2);stroke-width:3.5}
.stat-ring .ring-fg{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-linecap:round;transition:stroke-dasharray .6s ease}
.stat-ring .ring-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:10px;font-weight:700;color:var(--text)}
.stat-ring .ring-label{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--text3);white-space:nowrap}
.header-actions{display:flex;gap:8px}
.btn-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:var(--transition);font-size:18px}
.btn-icon:hover,.btn-icon.active{background:var(--accent);color:var(--white)}

.main{display:flex;flex:1;overflow:hidden}

/* ===== SIDEBAR NAV ===== */
.sidebar{width:200px;background:var(--white);padding:16px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);overflow-y:auto;flex-shrink:0}
.nav-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius-sm);transition:var(--transition);position:relative;cursor:pointer;user-select:none}
.nav-card:hover{background:var(--bg);transform:translateX(4px)}
.nav-card.active{background:var(--bg);box-shadow:inset 3px 0 0 var(--accent)}
.nav-card .icon{font-size:22px;width:32px;text-align:center;flex-shrink:0}
.nav-card .label{font-size:14px;font-weight:600;color:var(--text)}
.nav-card .badge{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--white);background:var(--accent);padding:1px 8px;border-radius:10px;font-weight:600}

/* ===== CONTENT AREA ===== */
.content{flex:1;overflow-y:auto;padding:20px;position:relative}
.panel{display:none;animation:fadeUp .3s ease}
.panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.panel-title{font-size:22px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.panel-title .icon{font-size:26px}

/* ===== CARDS ===== */
.card{background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px;transition:var(--transition)}
.card:hover{box-shadow:var(--shadow-lg)}

/* ===== CHECKBOX ITEMS ===== */
.check-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius-sm);background:var(--bg);margin-bottom:10px;transition:var(--transition);cursor:pointer;user-select:none}
.check-item:hover{background:var(--bg2)}
.check-item.done{opacity:.7}
.check-item.done .check-text{text-decoration:line-through;color:var(--text3)}
.custom-check{width:24px;height:24px;border-radius:6px;border:2px solid var(--accent-l);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:var(--transition)}
.check-item.done .custom-check{background:var(--accent);border-color:var(--accent)}
.custom-check svg{width:14px;height:14px;stroke:var(--white);stroke-width:3;fill:none;opacity:0;transition:var(--transition)}
.check-item.done .custom-check svg{opacity:1}
.check-text{font-size:15px;font-weight:500}
.check-label{font-size:12px;color:var(--text3);margin-left:auto}

/* ===== CHECKIN ITEMS ===== */
.checkin-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius-sm);background:var(--bg);margin-bottom:10px;transition:var(--transition)}
.checkin-item:hover{background:var(--bg2)}
.checkin-item.done{border-left:3px solid var(--accent)}
.checkin-icon{font-size:24px}
.checkin-info{flex:1}
.checkin-title{font-size:15px;font-weight:600}
.checkin-desc{font-size:12px;color:var(--text3)}
.btn-checkin{padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600;transition:var(--transition)}
.btn-checkin:not(.done){background:var(--accent);color:var(--white)}
.btn-checkin:not(.done):hover{background:var(--accent-d)}
.btn-checkin.done{background:var(--bg2);color:var(--text3)}

/* ===== MEMO CALENDAR ===== */
.memo-toolbar{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.memo-toolbar .search-box{flex:1;min-width:150px}
.btn-toggle{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;background:var(--bg);transition:var(--transition)}
.btn-toggle.active{background:var(--accent);color:var(--white)}
.btn-nav{width:32px;height:32px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px;transition:var(--transition)}
.btn-nav:hover{background:var(--accent);color:var(--white)}
.calendar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:600;font-size:16px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-weekday{text-align:center;font-size:12px;font-weight:600;color:var(--text3);padding:6px 0}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--radius-sm);font-size:14px;cursor:pointer;transition:var(--transition);position:relative;background:var(--bg)}
.cal-day:hover{background:var(--bg2);transform:scale(1.05)}
.cal-day.today{background:var(--accent);color:var(--white);font-weight:700;box-shadow:0 2px 8px rgba(129,199,132,.4)}
.cal-day.other-month{opacity:.3}
.cal-day .memo-dot{position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--accent-d)}
.cal-day.today .memo-dot{background:var(--white)}
.memo-list{margin-top:12px}
.memo-entry{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;background:var(--bg);border-radius:var(--radius-xs);margin-bottom:8px;font-size:14px}
.memo-entry .memo-text{flex:1;word-break:break-all}
.memo-entry .memo-del{color:var(--text3);font-size:18px;padding:0 4px;transition:var(--transition)}
.memo-entry .memo-del:hover{color:#e53935}
.search-result{background:#FFF9C4;border-radius:var(--radius-xs);padding:2px 4px}
.memo-selected-date{font-size:14px;font-weight:600;color:var(--text2);margin:12px 0 8px;display:flex;align-items:center;gap:8px}
.memo-input-row{display:flex;gap:8px;margin-bottom:12px}
.memo-input-row input{flex:1}
.btn-add{padding:8px 20px;border-radius:20px;background:var(--accent);color:var(--white);font-weight:600;font-size:14px;transition:var(--transition)}
.btn-add:hover{background:var(--accent-d)}

/* ===== REVIEW ===== */
.review-date-nav{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.review-date-nav .date-display{font-size:16px;font-weight:600;flex:1;text-align:center}
.review-editor{width:100%;min-height:200px;resize:vertical;padding:14px;border-radius:var(--radius-sm);line-height:1.7}
.review-status{margin-top:12px;font-size:14px;color:var(--text3)}
.review-status.has-review{color:var(--accent-d);font-weight:600}
.btn-save{padding:8px 24px;border-radius:20px;background:var(--accent);color:var(--white);font-weight:600;margin-top:12px;transition:var(--transition)}
.btn-save:hover{background:var(--accent-d)}

/* ===== RECORDS ===== */
.record-search{margin-bottom:16px}
.btn-new-record{padding:10px 24px;border-radius:20px;background:var(--accent);color:var(--white);font-weight:600;margin-bottom:16px;transition:var(--transition)}
.btn-new-record:hover{background:var(--accent-d)}
.record-item{padding:16px;background:var(--bg);border-radius:var(--radius-sm);margin-bottom:12px;transition:var(--transition)}
.record-item:hover{box-shadow:var(--shadow)}
.record-title{font-size:16px;font-weight:700;margin-bottom:4px}
.record-content{font-size:14px;color:var(--text2);margin-bottom:8px;white-space:pre-wrap;word-break:break-all}
.record-meta{font-size:12px;color:var(--text3);display:flex;justify-content:space-between;align-items:center}
.record-del{font-size:13px;padding:4px 10px;border-radius:12px;background:#FFEBEE;color:#e53935;transition:var(--transition)}
.record-del:hover{background:#e53935;color:var(--white)}

/* ===== STATS PANEL ===== */
.stats-overview{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.stats-card{text-align:center;padding:20px;background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow)}
.stats-card .big-ring{width:80px;height:80px;margin:0 auto 10px;position:relative}
.stats-card .big-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.stats-card .big-ring .ring-bg{fill:none;stroke:var(--bg2);stroke-width:6}
.stats-card .big-ring .ring-fg{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dasharray .6s ease}
.stats-card .big-ring .pct{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px;font-weight:800;color:var(--text)}
.stats-card .stats-label{font-size:14px;font-weight:600;color:var(--text2)}
.chart-container{background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.chart-container h3{font-size:16px;margin-bottom:12px;color:var(--text2)}
.chart-container canvas{max-height:250px}
.module-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:16px}
.module-stat-card{padding:16px;background:var(--bg);border-radius:var(--radius-sm);text-align:center}
.module-stat-card .ms-icon{font-size:28px;margin-bottom:6px}
.module-stat-card .ms-name{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:4px}
.module-stat-card .ms-rate{font-size:22px;font-weight:800;color:var(--text)}
.module-stat-card .ms-detail{font-size:11px;color:var(--text3)}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:var(--white);border-radius:var(--radius);padding:24px;max-width:460px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:modalIn .25s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal h3{font-size:18px;margin-bottom:14px}
.modal textarea,.modal input{width:100%;margin-bottom:12px}
.modal .modal-actions{display:flex;gap:10px;justify-content:flex-end}
.modal .modal-actions button{padding:8px 20px;border-radius:20px;font-weight:600;transition:var(--transition)}
.modal .btn-cancel{background:var(--bg)}
.modal .btn-confirm{background:var(--accent);color:var(--white)}
.modal .btn-confirm:hover{background:var(--accent-d)}

/* ===== DAILY QUOTE ===== */
.quote-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--white);border-radius:var(--radius);padding:32px;max-width:340px;width:90%;box-shadow:var(--shadow-lg);z-index:200;text-align:center;animation:modalIn .4s ease}
.quote-toast .quote-icon{font-size:40px;margin-bottom:12px}
.quote-toast .quote-text{font-size:16px;font-weight:500;line-height:1.7;color:var(--text);margin-bottom:16px;font-style:italic}
.quote-toast .quote-date{font-size:13px;color:var(--text3);margin-bottom:16px}
.quote-toast .btn-ok{padding:10px 32px;border-radius:20px;background:var(--accent);color:var(--white);font-weight:600;font-size:15px;transition:var(--transition)}
.quote-toast .btn-ok:hover{background:var(--accent-d)}
.quote-backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.35);z-index:199}

/* ===== CELEBRATION ===== */
.celebration-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:300;pointer-events:none;display:none}
.celebration-overlay.show{display:block;pointer-events:auto}
.confetti{position:fixed;width:10px;height:10px;border-radius:2px;top:-10px;animation:confettiFall 2.5s ease-out forwards}
@keyframes confettiFall{
  0%{transform:translateY(0) rotate(0deg);opacity:1}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}
.celebration-msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--white);border-radius:var(--radius);padding:36px;box-shadow:var(--shadow-lg);z-index:301;text-align:center;animation:modalIn .4s ease;pointer-events:auto}
.celebration-msg .cele-icon{font-size:48px;margin-bottom:12px}
.celebration-msg h2{font-size:22px;margin-bottom:8px;color:var(--text)}
.celebration-msg p{font-size:14px;color:var(--text3);margin-bottom:16px}
.celebration-msg button{padding:10px 32px;border-radius:20px;background:var(--accent);color:var(--white);font-weight:600;transition:var(--transition)}
.celebration-msg button:hover{background:var(--accent-d)}

/* ===== EMPTY STATE ===== */
.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-state .empty-icon{font-size:40px;margin-bottom:10px}
.empty-state p{font-size:14px}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  header{padding:10px 14px;gap:8px}
  .logo{font-size:17px}
  .header-center{order:3;width:100%;justify-content:center}
  .header-stats{gap:8px}
  .stat-ring{width:36px;height:36px}
  .stat-ring .ring-text{font-size:9px}
  .stat-ring .ring-label{font-size:8px;bottom:-14px}
  .main{flex-direction:column}
  .sidebar{width:100%;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:8px;gap:4px;order:2;box-shadow:0 -1px 8px rgba(46,125,50,.1);-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .sidebar::-webkit-scrollbar{display:none}
  .nav-card{flex-direction:column;padding:10px 14px;gap:4px;min-width:72px;flex-shrink:0}
  .nav-card .icon{width:auto}
  .nav-card .label{font-size:11px}
  .nav-card .badge{position:absolute;top:4px;right:4px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;padding:0 4px}
  .nav-card.active{box-shadow:inset 0 -3px 0 var(--accent)}
  .content{padding:14px;flex:1;overflow-y:auto}
  .panel-title{font-size:19px}
  .stats-overview{grid-template-columns:repeat(3,1fr);gap:10px}
  .stats-card{padding:14px}
  .stats-card .big-ring{width:60px;height:60px}
  .stats-card .big-ring .pct{font-size:16px}
  .module-stats{grid-template-columns:repeat(2,1fr)}
  .quote-toast{max-width:300px;padding:24px}
}
@media(max-width:400px){
  .header-stats .stat-ring:nth-child(3){display:none}
  .nav-card{min-width:60px;padding:8px 10px}
}
</style>
</head>
<body>
<div id="app">
  <!-- HEADER -->
  <header>
    <div class="logo">🌿 <span>yuan工作台</span></div>
    <div class="header-center">
      <div class="header-date" id="headerDate"></div>
      <div class="header-stats" id="headerStats"></div>
    </div>
    <div class="header-actions">
      <button class="btn-icon" onclick="switchPanel('stats')" title="统计">📊</button>
    </div>
  </header>

  <div class="main">
    <!-- SIDEBAR NAV -->
    <nav class="sidebar" id="sidebar"></nav>

    <!-- CONTENT -->
    <div class="content" id="content">
      <!-- 每日任务 -->
      <div class="panel active" id="panel-tasks">
        <div class="panel-title"><span class="icon">📋</span>每日任务</div>
        <div id="tasksList"></div>
      </div>

      <!-- 每日打卡 -->
      <div class="panel" id="panel-checkins">
        <div class="panel-title"><span class="icon">✅</span>每日打卡</div>
        <div id="checkinsList"></div>
      </div>

      <!-- 备忘录 -->
      <div class="panel" id="panel-memos">
        <div class="panel-title"><span class="icon">📝</span>备忘录</div>
        <div class="memo-toolbar">
          <button class="btn-nav" onclick="memoNavPrev()">◀</button>
          <div id="memoNavTitle" style="font-weight:600;font-size:15px;flex:1;text-align:center"></div>
          <button class="btn-nav" onclick="memoNavNext()">▶</button>
          <button class="btn-toggle" id="btnMemoWeek" onclick="setMemoView('week')">按周</button>
          <button class="btn-toggle" id="btnMemoMonth" onclick="setMemoView('month')">按月</button>
        </div>
        <div style="margin-bottom:12px">
          <input type="text" id="memoSearch" class="search-box" placeholder="🔍 搜索备忘内容..." oninput="searchMemos()" style="width:100%">
        </div>
        <div id="memoSearchResults" style="display:none"></div>
        <div id="memoCalendar"></div>
        <div id="memoDayContent"></div>
      </div>

      <!-- 每日复盘 -->
      <div class="panel" id="panel-reviews">
        <div class="panel-title"><span class="icon">🔄</span>每日复盘</div>
        <div class="review-date-nav">
          <button class="btn-nav" onclick="reviewNav(-1)">◀</button>
          <div class="date-display" id="reviewDateDisplay"></div>
          <button class="btn-nav" onclick="reviewNav(1)">▶</button>
          <button class="btn-toggle" onclick="reviewGoToday()" style="font-size:12px">今天</button>
        </div>
        <div class="card">
          <textarea class="review-editor" id="reviewEditor" placeholder="记录今天的复盘内容..."></textarea>
          <div class="review-status" id="reviewStatus"></div>
          <button class="btn-save" onclick="saveReview()">💾 保存复盘</button>
        </div>
      </div>

      <!-- 重要记录 -->
      <div class="panel" id="panel-records">
        <div class="panel-title"><span class="icon">⭐</span>重要记录</div>
        <div class="record-search">
          <input type="text" id="recordSearch" placeholder="🔍 搜索记录标题或内容..." oninput="renderRecords()" style="width:100%">
        </div>
        <button class="btn-new-record" onclick="showRecordModal()">➕ 添加记录</button>
        <div id="recordsList"></div>
      </div>

      <!-- 统计 -->
      <div class="panel" id="panel-stats">
        <div class="panel-title"><span class="icon">📊</span>完成情况统计</div>
        <div class="stats-overview" id="statsOverview"></div>
        <div class="module-stats" id="moduleStats"></div>
        <div class="chart-container"><h3>📈 本周每日完成率</h3><canvas id="weekChart"></canvas></div>
        <div class="chart-container"><h3>📉 本月完成率趋势</h3><canvas id="monthChart"></canvas></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<!-- CELEBRATION -->
<div class="celebration-overlay" id="celebrationOverlay">
  <div class="celebration-msg">
    <div class="cele-icon">🎉</div>

    <button onclick="hideCelebration()">继续加油 💪</button>
  </div>
</div>

<script>
/* ===== CONSTANTS ===== */
const STORAGE_KEYS = { tasks:'yuan_tasks', checkins:'yuan_checkins', memos:'yuan_memos', reviews:'yuan_reviews', records:'yuan_records', quoteDate:'yuan_quote_date' };
const TASKS_DEF = [{key:'reading',label:'读书 20 页',icon:'📖'},{key:'exercise',label:'运动 30 分钟',icon:'🏃'}];
const CHECKINS_DEF = [{key:'wakeEarly',label:'早起',desc:'6:00 前',icon:'🌅'},{key:'drinkWater',label:'空腹喝温水',desc:'晨起一杯',icon:'💧'},{key:'sleepEarly',label:'早睡',desc:'23:00 前',icon:'🌙'}];
const WEEKDAYS = ['一','二','三','四','五','六','日'];
const QUOTES = [
  '每一天都是新的开始，把握今天，就是把握未来。',

  '生活不是等待暴风雨过去，而是学会在雨中起舞。',
  '保持热爱，奔赴山海。',

  '你只管努力，剩下的交给时间。'
];

const NAV_ITEMS = [
  {id:'tasks',label:'每日任务',icon:'📋'},
  {id:'checkins',label:'每日打卡',icon:'✅'},
  {id:'memos',label:'备忘录',icon:'📝'},
  {id:'reviews',label:'每日复盘',icon:'🔄'},
  {id:'records',label:'重要记录',icon:'⭐'}
];

/* ===== STATE ===== */
let activePanel = 'tasks';
let selectedDate = new Date();
let reviewDate = new Date();
let memoViewMode = 'week'; // 'week' | 'month'
let memoViewDate = new Date();
let weekChartInstance = null;
let monthChartInstance = null;

/* ===== UTILS ===== */
function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDisplay(d){ return `${d.getMonth()+1}月${d.getDate()}日`; }
function fmtFull(d){ return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 周${'日一二三四五六'[d.getDay()]}`; }
function today(){ return fmt(new Date()); }
function isToday(d){ return fmt(d)===today(); }
function parseD(s){ const p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function getMonday(d){ const day=d.getDay(); const diff=d.getDate()-day+(day===0?-6:1); return new Date(d.getFullYear(),d.getMonth(),diff); }
function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ===== LOCALSTORAGE HELPERS ===== */
function loadData(key,def){ try{const v=localStorage.getItem(key);return v?JSON.parse(v):def}catch(e){return def} }
function saveData(key,val){ localStorage.setItem(key,JSON.stringify(val)); }

function getTasks(dateStr){ return loadData(STORAGE_KEYS.tasks,{})[dateStr]||{}; }
function setTasks(dateStr,tasks){ const all=loadData(STORAGE_KEYS.tasks,{}); all[dateStr]=tasks; saveData(STORAGE_KEYS.tasks,all); }
function getCheckins(dateStr){ return loadData(STORAGE_KEYS.checkins,{})[dateStr]||{}; }
function setCheckins(dateStr,c){ const all=loadData(STORAGE_KEYS.checkins,{}); all[dateStr]=c; saveData(STORAGE_KEYS.checkins,all); }
function getMemos(dateStr){ return loadData(STORAGE_KEYS.memos,{})[dateStr]||[]; }
function setMemos(dateStr,list){ const all=loadData(STORAGE_KEYS.memos,{}); all[dateStr]=list; saveData(STORAGE_KEYS.memos,all); }
function getReview(dateStr){ return loadData(STORAGE_KEYS.reviews,{})[dateStr]||''; }
function setReviewData(dateStr,content){ const all=loadData(STORAGE_KEYS.reviews,{}); all[dateStr]=content; saveData(STORAGE_KEYS.reviews,all); }
function getRecords(){ return loadData(STORAGE_KEYS.records,[]); }
function setRecords(arr){ saveData(STORAGE_KEYS.records,arr); }

/* ===== COMPLETION STATS ===== */
function getDayCompletion(dateStr){
  const tasks=getTasks(dateStr), checkins=getCheckins(dateStr), review=getReview(dateStr);
  let items=[
    {label:'读书',done:!!tasks.reading},
    {label:'运动',done:!!tasks.exercise},
    {label:'早起',done:!!checkins.wakeEarly},
    {label:'喝温水',done:!!checkins.drinkWater},
    {label:'早睡',done:!!checkins.sleepEarly},
    {label:'复盘',done:review.trim().length>0}
  ];
  const done=items.filter(i=>i.done).length;
  return {items,total:6,done,rate:done/6};
}

function getTasksCheckinsDone(dateStr){
  const tasks=getTasks(dateStr), checkins=getCheckins(dateStr);
  return [!!tasks.reading, !!tasks.exercise, !!checkins.wakeEarly, !!checkins.drinkWater, !!checkins.sleepEarly].filter(Boolean).length;
}

function getRangeCompletion(startStr, days){
  let totalDone=0, totalPossible=0;
  for(let i=0;i<days;i++){
    const d=parseD(startStr); d.setDate(d.getDate()+i);
    const ds=fmt(d);
    const c=getDayCompletion(ds);
    totalDone+=c.done; totalPossible+=c.total;
  }
  return {done:totalDone,total:totalPossible,rate:totalPossible?totalDone/totalPossible:0};
}

function getWeekRange(){
  const mon=getMonday(new Date()); const sun=new Date(mon); sun.setDate(sun.getDate()+6);
  return {start:fmt(mon),end:fmt(sun)};
}
function getMonthRange(){
  const now=new Date(); const first=new Date(now.getFullYear(),now.getMonth(),1);
  return {start:fmt(first),days:daysInMonth(now.getFullYear(),now.getMonth())};
}

function getModuleRate(dateStr, module){
  if(module==='tasks'){ const t=getTasks(dateStr); return [!!t.reading,!!t.exercise].filter(Boolean).length/2; }
  if(module==='checkins'){ const c=getCheckins(dateStr); return [!!c.wakeEarly,!!c.drinkWater,!!c.sleepEarly].filter(Boolean).length/3; }
  if(module==='review'){ return getReview(dateStr).trim().length>0?1:0; }
  return 0;
}

/* ===== NAVIGATION ===== */
function switchPanel(id){
  activePanel=id;
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-card').forEach(n=>n.classList.remove('active'));
  const panel=document.getElementById('panel-'+id);
  const nav=document.querySelector(`.nav-card[data-id="${id}"]`);
  if(panel)panel.classList.add('active');
  if(nav)nav.classList.add('active');
  document.getElementById('content').scrollTop=0;
  if(id==='stats') renderStats();
  if(id==='memos') renderMemoCalendar();
  if(id==='reviews') renderReview();
  if(id==='records') renderRecords();
}

/* ===== RENDER NAV ===== */
function renderNav(){
  const sb=document.getElementById('sidebar');
  sb.innerHTML=NAV_ITEMS.map(n=>{
    const badge=getNavBadge(n.id);
    return `<div class="nav-card ${n.id===activePanel?'active':''}" data-id="${n.id}" onclick="switchPanel('${n.id}')">
      <div class="icon">${n.icon}</div><div class="label">${n.label}</div>${badge?`<div class="badge">${badge}</div>`:''}
    </div>`;
  }).join('');
}

function getNavBadge(id){
  const ds=today();
  if(id==='tasks'){const t=getTasks(ds);return[!!t.reading,!!t.exercise].filter(Boolean).length+'/2';}
  if(id==='checkins'){const c=getCheckins(ds);return[!!c.wakeEarly,!!c.drinkWater,!!c.sleepEarly].filter(Boolean).length+'/3';}
  if(id==='reviews'){return getReview(ds).trim().length>0?'✓':'';}
  return '';
}

/* ===== RENDER HEADER ===== */
function renderHeader(){
  const now=new Date();
  document.getElementById('headerDate').textContent=fmtFull(now);
  
  // Stats rings
  const dayComp=getDayCompletion(today());
  const weekR=getWeekRange(); const weekComp=getRangeCompletion(weekR.start,7);
  const monthR=getMonthRange(); const monthComp=getRangeCompletion(monthR.start,monthR.days);
  
  document.getElementById('headerStats').innerHTML=`
    <div class="stat-ring"><svg viewBox="0 0 36 36"><path class="ring-bg" d="M18 2.0845a15.9155 15.9155 0 010 31.831a15.9155 15.9155 0 010-31.831"/><path class="ring-fg" d="M18 2.0845a15.9155 15.9155 0 010 31.831a15.9155 15.9155 0 010-31.831" stroke-dasharray="${dayComp.rate*100},100"/></svg><div class="ring-text">${Math.round(dayComp.rate*100)}%</div><div class="ring-label">今日</div></div>
    <div class="stat-ring"><svg viewBox="0 0 36 36"><path class="ring-bg" d="M18 2.0845a15.9155 15.9155 0 010 31.831a15.9155 15.9155 0 010-31.831"/><path class="ring-fg" d="M18 2.0845a15.9155 15.9155 0 010 31.831a15.9155 15.9155 0 010-31.831" stroke-dasharray="${weekComp.rate*100},100"/></svg><div class="ring-text">${Math.round(weekComp.rate*100)}%</div><div class="ring-label">本周</div></div>
    <div class="stat-ring"><svg viewBox="0 0 36 36"><path class="ring-bg" d="M18 2.0845a15.9155 15.9155 0 010 31.831a15.9155 15.9155 0 010-31.831"/><path class="ring-fg" d="M18 2.0845a15.9155 15.9155 0 010 31.831a15.9155 15.9155 0 010-31.831" stroke-dasharray="${monthComp.rate*100},100"/></svg><div class="ring-text">${Math.round(monthComp.rate*100)}%</div><div class="ring-label">本月</div></div>
  `;
}

/* ===== RENDER TASKS ===== */
function renderTasks(){
  const ds=today(); const tasks=getTasks(ds);
  document.getElementById('tasksList').innerHTML=TASKS_DEF.map(t=>{
    const done=!!tasks[t.key];
    return `<div class="check-item ${done?'done':''}" onclick="toggleTask('${t.key}')">
      <div class="custom-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      <span class="check-text">${t.icon} ${t.label}</span>
      <span class="check-label">${done?'已完成':'未完成'}</span>
    </div>`;
  }).join('');
  updateBadgeAndCelebration();
}

function toggleTask(key){
  const ds=today(); const tasks=getTasks(ds); tasks[key]=!tasks[key]; setTasks(ds,tasks); renderTasks(); renderHeader();
}

/* ===== RENDER CHECKINS ===== */
function renderCheckins(){
  const ds=today(); const checkins=getCheckins(ds);
  document.getElementById('checkinsList').innerHTML=CHECKINS_DEF.map(c=>{
    const done=!!checkins[c.key];
    return `<div class="checkin-item ${done?'done':''}">
      <div class="checkin-icon">${c.icon}</div>
      <div class="checkin-info"><div class="checkin-title">${c.label}</div><div class="checkin-desc">${c.desc}</div></div>
      <button class="btn-checkin ${done?'done':''}" onclick="toggleCheckin('${c.key}')">${done?'已完成 ✓':'打卡'}</button>
    </div>`;
  }).join('');
  updateBadgeAndCelebration();
}

function toggleCheckin(key){
  const ds=today(); const c=getCheckins(ds); c[key]=!c[key]; setCheckins(ds,c); renderCheckins(); renderHeader();
}

function updateBadgeAndCelebration(){
  renderNav(); checkCelebration();
}

/* ===== CELEBRATION ===== */
let celebrationShown=false;
function checkCelebration(){
  if(celebrationShown) return;
  if(getTasksCheckinsDone(today())>=5){
    celebrationShown=true;
    showCelebration();
  }
}
function showCelebration(){
  document.getElementById('celebrationOverlay').classList.add('show');
  // Create confetti
  const overlay=document.getElementById('celebrationOverlay');
  const colors=['#81C784','#66BB6A','#A5D6A7','#FFD54F','#FF8A65','#BA68C8','#4FC3F7','#E57373'];
  for(let i=0;i<50;i++){
    const el=document.createElement('div');el.className='confetti';
    el.style.left=Math.random()*100+'%';
    el.style.background=colors[Math.floor(Math.random()*colors.length)];
    el.style.width=(Math.random()*8+6)+'px';
    el.style.height=(Math.random()*8+6)+'px';
    el.style.animationDuration=(Math.random()*2+1.5)+'s';
    el.style.animationDelay=(Math.random()*1)+'s';
    overlay.appendChild(el);
  }
  setTimeout(()=>{overlay.querySelectorAll('.confetti').forEach(c=>c.remove())},4000);
}
function hideCelebration(){ document.getElementById('celebrationOverlay').classList.remove('show'); }

/* ===== MEMOS ===== */
function setMemoView(mode){
  memoViewMode=mode;
  document.getElementById('btnMemoWeek').classList.toggle('active',mode==='week');
  document.getElementById('btnMemoMonth').classList.toggle('active',mode==='month');
  renderMemoCalendar();
}

function memoNavPrev(){
  if(memoViewMode==='week'){ memoViewDate.setDate(memoViewDate.getDate()-7); }
  else{ memoViewDate.setMonth(memoViewDate.getMonth()-1); }
  renderMemoCalendar();
}
function memoNavNext(){
  if(memoViewMode==='week'){ memoViewDate.setDate(memoViewDate.getDate()+7); }
  else{ memoViewDate.setMonth(memoViewDate.getMonth()+1); }
  renderMemoCalendar();
}

function renderMemoCalendar(){
  const sr=document.getElementById('memoSearchResults');
  sr.style.display='none'; sr.innerHTML='';

  if(memoViewMode==='week'){
    renderWeekCalendar();
  } else {
    renderMonthCalendar();
  }
}

function renderWeekCalendar(){
  const mon=getMonday(memoViewDate);
  const sun=new Date(mon); sun.setDate(sun.getDate()+6);
  document.getElementById('memoNavTitle').textContent=`${fmtDisplay(mon)} - ${fmtDisplay(sun)}`;
  
  const allMemos=loadData(STORAGE_KEYS.memos,{});
  let html='<div class="calendar-grid">';
  WEEKDAYS.forEach((w,i)=>{
    html+=`<div class="cal-weekday">周${w}</div>`;
  });
  for(let i=0;i<7;i++){
    const d=new Date(mon); d.setDate(d.getDate()+i);
    const ds=fmt(d);
    const memos=allMemos[ds]||[];
    const isT=isToday(d);
    html+=`<div class="cal-day ${isT?'today':''}" onclick="selectMemoDate('${ds}')">
      <span>${d.getDate()}</span>
      ${memos.length?`<div class="memo-dot"></div>`:''}
    </div>`;
  }
  html+='</div>';
  document.getElementById('memoCalendar').innerHTML=html;
  // Select today by default
  const todayDs=today();
  if(!document.querySelector('.memo-selected')) selectMemoDate(todayDs);
}

function renderMonthCalendar(){
  const y=memoViewDate.getFullYear(), m=memoViewDate.getMonth();
  document.getElementById('memoNavTitle').textContent=`${y}年${m+1}月`;
  
  const allMemos=loadData(STORAGE_KEYS.memos,{});
  const firstDay=new Date(y,m,1);
  let startDow=(firstDay.getDay()+6)%7;
  const dim=daysInMonth(y,m);
  
  let html='<div class="calendar-grid">';
  WEEKDAYS.forEach(w=>{ html+=`<div class="cal-weekday">周${w}</div>`; });
  
  // Previous month padding
  const prevDim=daysInMonth(y,m-1);
  for(let i=startDow-1;i>=0;i--){
    const d=new Date(y,m-1,prevDim-i); const ds=fmt(d);
    const memos=allMemos[ds]||[];
    html+=`<div class="cal-day other-month" onclick="selectMemoDate('${ds}')"><span>${d.getDate()}</span>${memos.length?'<div class="memo-dot"></div>':''}</div>`;
  }
  // Current month
  for(let i=1;i<=dim;i++){
    const d=new Date(y,m,i); const ds=fmt(d);
    const memos=allMemos[ds]||[];
    const isT=isToday(d);
    html+=`<div class="cal-day ${isT?'today':''}" onclick="selectMemoDate('${ds}')"><span>${i}</span>${memos.length?'<div class="memo-dot"></div>':''}</div>`;
  }
  // Next month padding
  const totalCells=startDow+dim;
  const remaining=totalCells%7===0?0:7-totalCells%7;
  for(let i=1;i<=remaining;i++){
    const d=new Date(y,m+1,i); const ds=fmt(d);
    const memos=allMemos[ds]||[];
    html+=`<div class="cal-day other-month" onclick="selectMemoDate('${ds}')"><span>${i}</span>${memos.length?'<div class="memo-dot"></div>':''}</div>`;
  }
  html+='</div>';
  document.getElementById('memoCalendar').innerHTML=html;
  const todayDs=today();
  if(!document.querySelector('.memo-selected')) selectMemoDate(todayDs);
}

let selectedMemoDate=today();
function selectMemoDate(ds){
  selectedMemoDate=ds;
  // Highlight selected day
  document.querySelectorAll('.cal-day').forEach(el=>el.style.outline='');
  document.querySelectorAll('.cal-day').forEach(el=>{
    if(el.getAttribute('onclick')===`selectMemoDate('${ds}')`) el.style.outline='2px solid var(--accent)';
  });
  renderMemoDayContent(ds);
}

function renderMemoDayContent(ds){
  const d=parseD(ds);
  const memos=getMemos(ds);
  const html=`
    <div class="memo-selected-date">📅 ${fmtFull(d)}</div>
    <div class="memo-input-row">
      <input type="text" id="memoInput" placeholder="添加新备忘..." onkeydown="if(event.key==='Enter')addMemo()">
      <button class="btn-add" onclick="addMemo()">添加</button>
    </div>
    <div class="memo-list">${memos.length?memos.map((m,i)=>`
      <div class="memo-entry">
        <div class="memo-text">${escHtml(m)}</div>
        <button class="memo-del" onclick="deleteMemo(${i})">×</button>
      </div>
    `).join(''):'<div class="empty-state"><div class="empty-icon">📝</div><p>暂无备忘，点击上方添加</p></div>'}</div>
  `;
  document.getElementById('memoDayContent').innerHTML=html;
}

function addMemo(){
  const input=document.getElementById('memoInput');
  const text=input.value.trim();
  if(!text) return;
  const memos=getMemos(selectedMemoDate);
  memos.push(text);
  setMemos(selectedMemoDate,memos);
  input.value='';
  renderMemoCalendar();
  selectMemoDate(selectedMemoDate);
}

function deleteMemo(idx){
  const memos=getMemos(selectedMemoDate);
  memos.splice(idx,1);
  setMemos(selectedMemoDate,memos);
  renderMemoCalendar();
  selectMemoDate(selectedMemoDate);
}

function searchMemos(){
  const query=document.getElementById('memoSearch').value.trim();
  const sr=document.getElementById('memoSearchResults');
  if(!query){ sr.style.display='none'; return; }
  const allMemos=loadData(STORAGE_KEYS.memos,{});
  let results=[];
  Object.keys(allMemos).forEach(ds=>{
    allMemos[ds].forEach((text,i)=>{
      if(text.toLowerCase().includes(query.toLowerCase())){
        results.push({date:ds,text,index:i});
      }
    });
  });
  if(results.length===0){
    sr.style.display='block'; sr.innerHTML='<div class="empty-state" style="padding:16px"><p>未找到匹配的备忘内容</p></div>';
    return;
  }
  sr.style.display='block';
  sr.innerHTML=results.map(r=>`
    <div class="memo-entry" style="cursor:pointer" onclick="jumpToMemoDate('${r.date}')">
      <div class="memo-text"><span style="font-size:12px;color:var(--text3)">${r.date}</span><br>${highlightText(escHtml(r.text),query)}</div>
    </div>
  `).join('');
}

function jumpToMemoDate(ds){
  document.getElementById('memoSearch').value='';
  document.getElementById('memoSearchResults').style.display='none';
  // Navigate to the right week/month
  const d=parseD(ds);
  if(memoViewMode==='week'){ memoViewDate=new Date(d); }
  else{ memoViewDate=new Date(d.getFullYear(),d.getMonth(),1); }
  renderMemoCalendar();
  setTimeout(()=>selectMemoDate(ds),50);
}

function highlightText(text,query){
  const re=new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi');
  return text.replace(re,'<span class="search-result">$1</span>');
}

function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ===== REVIEWS ===== */
function renderReview(){
  const ds=fmt(reviewDate);
  document.getElementById('reviewDateDisplay').textContent=fmtFull(reviewDate);
  const content=getReview(ds);
  document.getElementById('reviewEditor').value=content;
  const status=document.getElementById('reviewStatus');
  if(content.trim()){
    status.textContent='✅ 已完成今日复盘';
    status.className='review-status has-review';
  } else {
    status.textContent='📝 尚未记录今日复盘';
    status.className='review-status';
  }
}

function saveReview(){
  const ds=fmt(reviewDate);
  const content=document.getElementById('reviewEditor').value;
  setReviewData(ds,content);
  renderReview(); renderHeader(); renderNav();
}

function reviewNav(offset){
  reviewDate.setDate(reviewDate.getDate()+offset);
  renderReview();
}

function reviewGoToday(){
  reviewDate=new Date();
  renderReview();
}

/* ===== RECORDS ===== */
function renderRecords(){
  const query=document.getElementById('recordSearch').value.trim().toLowerCase();
  let records=getRecords();
  if(query){
    records=records.filter(r=>r.title.toLowerCase().includes(query)||r.content.toLowerCase().includes(query));
  }
  records.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const list=document.getElementById('recordsList');
  if(records.length===0){
    list.innerHTML='<div class="empty-state"><div class="empty-icon">⭐</div><p>暂无记录，点击上方添加</p></div>';
    return;
  }
  list.innerHTML=records.map(r=>`
    <div class="record-item">
      <div class="record-title">${escHtml(r.title)}</div>
      <div class="record-content">${escHtml(r.content)}</div>
      <div class="record-meta">
        <span>${new Date(r.createdAt).toLocaleString('zh-CN')}</span>
        <button class="record-del" onclick="deleteRecord('${r.id}')">删除</button>
      </div>
    </div>
  `).join('');
}

function showRecordModal(){
  const modal=document.getElementById('modalContent');
  modal.innerHTML=`
    <h3>➕ 添加重要记录</h3>
    <input type="text" id="recTitle" placeholder="标题" maxlength="100">
    <textarea id="recContent" placeholder="内容" rows="5" style="min-height:100px"></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-confirm" onclick="addRecord()">保存</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
  setTimeout(()=>document.getElementById('recTitle').focus(),100);
}

function addRecord(){
  const title=document.getElementById('recTitle').value.trim();
  const content=document.getElementById('recContent').value.trim();
  if(!title){ alert('请输入标题'); return; }
  const records=getRecords();
  records.push({id:uid(),title,content,createdAt:new Date().toISOString()});
  setRecords(records);
  closeModal(); renderRecords();
}

function deleteRecord(id){
  if(!confirm('确定删除这条记录吗？')) return;
  const records=getRecords().filter(r=>r.id!==id);
  setRecords(records); renderRecords();
}

function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); }

/* ===== STATS ===== */
function renderStats(){
  renderStatsOverview();
  renderModuleStats();
  renderWeekChart();
  renderMonthChart();
}

function renderStatsOverview(){
  const dayComp=getDayCompletion(today());
  const weekR=getWeekRange(); const weekComp=getRangeCompletion(weekR.start,7);
  const monthR=getMonthRange(); const monthComp=getRangeCompletion(monthR.start,monthR.days);
  
  function ringHtml(pct,size){
    return `<div class="big-ring"><svg viewBox="0 0 36 36"><path class="ring-bg" d="M18 2.0845a15.9155 15.9155 0 010 31.831a15.9155 15.9155 0 010-31.831"/><path class="ring-fg" d="M18 2.0845a15.9155 15.9155 0 010 31.831a15.9155 15.9155 0 010-31.831" stroke-dasharray="${pct*100},100"/></svg><div class="pct">${Math.round(pct*100)}%</div></div>`;
  }
  
  document.getElementById('statsOverview').innerHTML=`
    <div class="stats-card">${ringHtml(dayComp.rate)}<div class="stats-label">今日完成率</div><div style="font-size:12px;color:var(--text3);margin-top:4px">${dayComp.done}/${dayComp.total} 项</div></div>
    <div class="stats-card">${ringHtml(weekComp.rate)}<div class="stats-label">本周完成率</div><div style="font-size:12px;color:var(--text3);margin-top:4px">${weekComp.done}/${weekComp.total} 项</div></div>
    <div class="stats-card">${ringHtml(monthComp.rate)}<div class="stats-label">本月完成率</div><div style="font-size:12px;color:var(--text3);margin-top:4px">${monthComp.done}/${monthComp.total} 项</div></div>
  `;
}

function renderModuleStats(){
  const ds=today();
  const modules=[
    {icon:'📋',name:'每日任务',rate:getModuleRate(ds,'tasks'),total:2,done:Math.round(getModuleRate(ds,'tasks')*2)},
    {icon:'✅',name:'每日打卡',rate:getModuleRate(ds,'checkins'),total:3,done:Math.round(getModuleRate(ds,'checkins')*3)},
    {icon:'🔄',name:'每日复盘',rate:getModuleRate(ds,'review'),total:1,done:getModuleRate(ds,'review')?1:0}
  ];
  document.getElementById('moduleStats').innerHTML=modules.map(m=>`
    <div class="module-stat-card">
      <div class="ms-icon">${m.icon}</div>
      <div class="ms-name">${m.name}</div>
      <div class="ms-rate">${Math.round(m.rate*100)}%</div>
      <div class="ms-detail">${m.done}/${m.total} 项已完成</div>
    </div>
  `).join('');
}

function renderWeekChart(){
  const mon=getMonday(new Date());
  const labels=[];const data=[];
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(d.getDate()+i);
    labels.push(`周${WEEKDAYS[i]}`);
    data.push(Math.round(getDayCompletion(fmt(d)).rate*100));
  }
  
  if(weekChartInstance) weekChartInstance.destroy();
  const ctx=document.getElementById('weekChart').getContext('2d');
  weekChartInstance=new Chart(ctx,{
    type:'bar',
    data:{labels,datasets:[{label:'完成率 %',data,backgroundColor:'rgba(129,199,132,0.7)',borderColor:'#81C784',borderWidth:2,borderRadius:8}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,max:100,ticks:{callback:v=>v+'%'}},x:{}}}
  });
}

function renderMonthChart(){
  const now=new Date();
  const y=now.getFullYear(),m=now.getMonth();
  const dim=daysInMonth(y,m);
  const labels=[];const data=[];
  
  // Show data up to today or full month
  const showDays=Math.min(dim,now.getDate());
  for(let i=1;i<=showDays;i++){
    labels.push(`${i}日`);
    data.push(Math.round(getDayCompletion(fmt(new Date(y,m,i))).rate*100));
  }
  
  if(monthChartInstance) monthChartInstance.destroy();
  const ctx=document.getElementById('monthChart').getContext('2d');
  monthChartInstance=new Chart(ctx,{
    type:'line',
    data:{labels,datasets:[{label:'完成率 %',data,borderColor:'#81C784',backgroundColor:'rgba(129,199,132,0.15)',fill:true,tension:.4,pointRadius:3,pointBackgroundColor:'#81C784'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,max:100,ticks:{callback:v=>v+'%'}},x:{ticks:{maxTicksLimit:15}}}}
  });
}

/* ===== DAILY QUOTE ===== */
function showDailyQuote(){
  const lastQuoteDate=localStorage.getItem(STORAGE_KEYS.quoteDate);
  if(lastQuoteDate===today()) return;
  localStorage.setItem(STORAGE_KEYS.quoteDate,today());
  
  const quote=QUOTES[Math.floor(Math.random()*QUOTES.length)];
  const now=new Date();
  const greetings=now.getHours()<12?'早上好':now.getHours()<18?'下午好':'晚上好';
  
  const backdrop=document.createElement('div');
  backdrop.className='quote-backdrop';
  backdrop.onclick=dismissQuote;
  
  const toast=document.createElement('div');
  toast.className='quote-toast';
  toast.innerHTML=`
    <div class="quote-icon">🌱</div>
    <div class="quote-date">${greetings}，今天是 ${fmtFull(now)}</div>
    <div class="quote-text">"${quote}"</div>
    <button class="btn-ok" onclick="dismissQuote()">开始新的一天 ☀️</button>
  `;
  
  document.body.appendChild(backdrop);
  document.body.appendChild(toast);
}

function dismissQuote(){
  document.querySelectorAll('.quote-toast,.quote-backdrop').forEach(el=>el.remove());
}

/* ===== INIT ===== */
function init(){
  renderNav();
  renderHeader();
  renderTasks();
  renderCheckins();
  setMemoView('week');
  renderReview();
  renderRecords();
  showDailyQuote();
  
  // Auto-save review on input (debounced)
  let saveTimeout;
  document.getElementById('reviewEditor').addEventListener('input',()=>{
    clearTimeout(saveTimeout);
    saveTimeout=setTimeout(()=>{
      const ds=fmt(reviewDate);
      setReviewData(ds,document.getElementById('reviewEditor').value);
      renderHeader(); renderNav();
    },1000);
  });
}

document.addEventListener('DOMContentLoaded', init);

// Service Worker Registration for PWA
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .then(reg => console.log('Service Worker registered:', reg))
    .catch(err => console.log('Service Worker registration failed:', err));
}
</script>
